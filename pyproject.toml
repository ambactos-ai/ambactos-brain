[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambactos-brain"
version = "0.1.0"
description = "Ambactos Brain — memory engine for agents"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Hestia Projekt"}]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "mcp>=2.3",
    "pydantic>=2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
documents = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
]

[tool.setuptools.packages.find]
where = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
